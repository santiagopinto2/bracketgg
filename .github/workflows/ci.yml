name: CI

on:
  pull_request:
    # labeled: adding the visual-change label reruns the checks
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Builds this commit and the base branch, then runs e2e/api-calls.mjs against a fake start.gg on both
      - run: sh e2e/compare.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          # Santi's start.gg test token, for one live check of the shared cache (absent on forks)
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          # A PR labeled visual-change may look different from the base branch (e2e/visual-diff.mjs)
          VISUAL_CHANGES_OK: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-out
          path: e2e-out

  # The build the live site deploys: ~/ops/bin/bracketgg-build downloads this artifact for main's head commit
  dist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_PLACEHOLDER: unused-in-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Generate the environment (public client ID only)
        run: |
          test -n "$STARTGG_CLIENT_ID" || { echo "repo variable STARTGG_CLIENT_ID is not set"; exit 1; }
          test -n "$STARTGG_REDIRECT_URI" || { echo "repo variable STARTGG_REDIRECT_URI is not set"; exit 1; }
          node scripts/generate-env.js
        env:
          STARTGG_CLIENT_ID: ${{ vars.STARTGG_CLIENT_ID }}
          STARTGG_REDIRECT_URI: ${{ vars.STARTGG_REDIRECT_URI }}
          STARTGG_CLIENT_SECRET: ${{ env.SECRET_PLACEHOLDER }}
      - run: npx ng build
      - name: Check the bundle for the client secret
        run: node scripts/check-bundle.js dist/bracketgg/browser "$SECRET_PLACEHOLDER"
      - name: Check the client ID made it in
        run: grep -rqF -- "$STARTGG_CLIENT_ID" dist/bracketgg/browser || { echo "client ID not found in the bundle"; exit 1; }
        env:
          STARTGG_CLIENT_ID: ${{ vars.STARTGG_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: bracketgg-dist
          path: dist/bracketgg/browser
          if-no-files-found: error
