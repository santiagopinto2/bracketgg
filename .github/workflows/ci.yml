name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Builds this commit and the base branch, then runs e2e/api-calls.mjs against a fake start.gg on both
      - run: sh e2e/compare.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-out
          path: e2e-out
